<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1550" viewBox="0 0 1600 1550" role="img" aria-labelledby="title desc" font-family="'Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif">
<title id="title">SO-101 语音与远程画面控制工作流</title><desc id="desc">语音转写或手输先经本地分流。OpenCV 将工位送入 DeepSeek。控制器校验动作，在 MuJoCo 中抓放后以双视角复核，回执或追问交还用户。各框列出测量与待改进项。</desc>
<defs><marker id="b" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L2.5 5 Z" fill="#245d9c"/></marker><marker id="g" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L2.5 5 Z" fill="#007d72"/></marker><marker id="o" viewBox="0 0 10 10" refX="8.8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 L2.5 5 Z" fill="#985421"/></marker></defs>
<rect x="0" y="0" width="1600" height="1550" rx="0" fill="#f6f9f8" stroke="none"/>
<text x="78" y="75" font-size="51" font-weight="700" fill="#172f43">SO-101 语音与远程画面控制</text>
<text x="80" y="117" font-size="22" font-weight="400" fill="#466271">Windows 控制电脑  /  桌面 A、B、C 工位  /  当前执行端为 MuJoCo 仿真</text>
<rect x="78" y="150" width="1448" height="64" rx="12" fill="#18394c" stroke="none"/>
<text x="103" y="191" font-size="28" font-weight="700" fill="#ffffff">远程操作者</text>
<text x="293" y="191" font-size="22" font-weight="400" fill="#d6edee">录音或打字发令</text>
<text x="591" y="191" font-size="22" font-weight="400" fill="#d6edee">查看固定 / 腕部画面</text>
<text x="971" y="191" font-size="22" font-weight="400" fill="#d6edee">核对转写、补充回答、查看结果</text>
<path d="M 405 214 V 242" fill="none" stroke="#245d9c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#b)"/>
<path d="M 790 214 V 523 H 740" fill="none" stroke="#245d9c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#b)"/>
<text x="798" y="457" font-size="18" font-weight="700" fill="#245d9c">手输</text>
<path d="M 1210 244 V 215" fill="none" stroke="#007d72" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#g)"/>
<rect x="78" y="244" width="660" height="158" rx="13" fill="#fff" stroke="#c9d7dc"/>
<rect x="80" y="260" width="5" height="126" rx="2" fill="#245d9c" stroke="none"/>
<text x="102" y="281" font-size="28" font-weight="700" fill="#172f43">语音转文本  ·  SenseVoiceSmall INT8</text>
<text x="102" y="315" font-size="20" font-weight="400" fill="#466271">本机 CPU 中文转写，四线程，录音最长 30 秒。</text>
<text x="102" y="346" font-size="21" font-weight="700" fill="#245d9c">15 段组内留出，整句对 6/15，字符错误率 13.39%。</text>
<text x="102" y="377" font-size="20" font-weight="400" fill="#466271">建议　使用完整动词；发令前核对方向、数值、单位。</text>
<rect x="866" y="244" width="660" height="158" rx="13" fill="#fff" stroke="#c9d7dc"/>
<rect x="868" y="260" width="5" height="126" rx="2" fill="#007d72" stroke="none"/>
<text x="890" y="281" font-size="28" font-weight="700" fill="#172f43">桌面感知  ·  固定相机与 OpenCV</text>
<text x="890" y="315" font-size="20" font-weight="400" fill="#466271">HSV 提取红块，估计工位与底座平面坐标。</text>
<text x="890" y="346" font-size="21" font-weight="700" fill="#007d72">100 张标注实拍中，唯一且框对红块 67/100。</text>
<text x="890" y="377" font-size="20" font-weight="400" fill="#466271">改进　限定工作区与目标尺寸；贴纸留作备选。</text>
<path d="M 405 402 V 443" fill="none" stroke="#245d9c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#b)"/>
<path d="M 1196 402 V 647" fill="none" stroke="#007d72" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#g)"/>
<text x="1220" y="508" font-size="19" font-weight="700" fill="#007d72">可见物体、工位</text>
<text x="1220" y="537" font-size="19" font-weight="400" fill="#007d72">及 XY 毫米坐标</text>
<rect x="78" y="445" width="660" height="158" rx="13" fill="#fff" stroke="#c9d7dc"/>
<rect x="80" y="461" width="5" height="126" rx="2" fill="#245d9c" stroke="none"/>
<text x="102" y="482" font-size="28" font-weight="700" fill="#172f43">本地分流  ·  指令还是控制信号</text>
<text x="102" y="516" font-size="20" font-weight="400" fill="#466271">忽略禁止句，暂停、恢复和查询就地处理。</text>
<text x="102" y="547" font-size="21" font-weight="700" fill="#245d9c">自建 10 条本地口令，正确分流 10/10。</text>
<text x="102" y="578" font-size="20" font-weight="400" fill="#466271">局限　转写丢失否定后，无法恢复被删除的语义。</text>
<path d="M 405 603 V 647" fill="none" stroke="#245d9c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#b)"/>
<text x="423" y="635" font-size="18" font-weight="700" fill="#245d9c">新任务或澄清答复</text>
<path d="M 78 483 H 30" fill="none" stroke="#985421" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  />
<circle cx="30" cy="483" r="5" fill="#985421"/>
<rect x="78" y="650" width="1448" height="158" rx="13" fill="#eaf3fa" stroke="#afc9df"/>
<rect x="80" y="666" width="5" height="126" rx="2" fill="#245d9c" stroke="none"/>
<text x="102" y="690" font-size="30" font-weight="700" fill="#172f43">任务规划  ·  交大 DeepSeek Reasoner</text>
<text x="102" y="730" font-size="21" font-weight="400" fill="#466271">合并原话、观测、持物状态及澄清上下文。</text>
<text x="102" y="763" font-size="21" font-weight="400" fill="#466271">固定思考模式；仅解析最终 JSON，无调用批准弹窗。</text>
<text x="787" y="691" font-size="24" font-weight="700" fill="#245d9c">22 题诊断：动作严格对 15/16，追问有效 6/6。</text>
<text x="787" y="729" font-size="20" font-weight="400" fill="#466271">同题普通模式为 10/16、5/6；这是已知题目诊断。</text>
<text x="787" y="763" font-size="20" font-weight="400" fill="#466271">改进　方向仍可反转；请求中位 14.38 秒，需要等待。</text>
<path d="M 78 716 H 30" fill="none" stroke="#985421" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  />
<circle cx="30" cy="716" r="5" fill="#985421"/>
<path d="M 405 808 V 868" fill="none" stroke="#245d9c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#b)"/>
<text x="424" y="846" font-size="18" font-weight="700" fill="#245d9c">动作 JSON  /  1 至 4 步</text>
<rect x="78" y="872" width="660" height="158" rx="13" fill="#fff" stroke="#c9d7dc"/>
<rect x="80" y="888" width="5" height="126" rx="2" fill="#245d9c" stroke="none"/>
<text x="102" y="909" font-size="28" font-weight="700" fill="#172f43">控制校验  ·  原话、场景及路径</text>
<text x="102" y="943" font-size="20" font-weight="400" fill="#466271">校验动作、符号、限幅，执行前逐段预检。</text>
<text x="102" y="974" font-size="21" font-weight="700" fill="#245d9c">修复后重放：15 个正确动作均放行，1 个错误仍拒。</text>
<text x="102" y="1005" font-size="20" font-weight="400" fill="#466271">建议　规范口令与完整单位；自由组合仍有核验局限。</text>
<rect x="866" y="872" width="660" height="158" rx="13" fill="#fff" stroke="#c9d7dc"/>
<rect x="868" y="888" width="5" height="126" rx="2" fill="#007d72" stroke="none"/>
<text x="890" y="909" font-size="28" font-weight="700" fill="#172f43">动作执行  ·  IK 与接触反馈</text>
<text x="890" y="943" font-size="20" font-weight="400" fill="#466271">预对准、限速合爪、试抬，再执行搬运。</text>
<text x="890" y="974" font-size="21" font-weight="700" fill="#007d72">仿真偏位对照：获准尝试的 39 个摆位中落位 38 个。</text>
<text x="890" y="1005" font-size="20" font-weight="400" fill="#466271">改进　实机独立测位移、夹持证据与停止响应。</text>
<path d="M 738 951 H 864" fill="none" stroke="#245d9c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#b)"/>
<text x="764" y="934" font-size="18" font-weight="700" fill="#245d9c">通过</text>
<path d="M 1196 1030 V 1091" fill="none" stroke="#007d72" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#g)"/>
<text x="1220" y="1071" font-size="18" font-weight="700" fill="#007d72">退爪后复看</text>
<rect x="866" y="1095" width="660" height="158" rx="13" fill="#fff" stroke="#c9d7dc"/>
<rect x="868" y="1111" width="5" height="126" rx="2" fill="#007d72" stroke="none"/>
<text x="890" y="1132" font-size="28" font-weight="700" fill="#172f43">结果复核  ·  固定优先，必要时用腕部</text>
<text x="890" y="1166" font-size="20" font-weight="400" fill="#466271">0、0.5、1 个仿真秒各看一帧；持续确认才报成功。</text>
<text x="890" y="1197" font-size="21" font-weight="700" fill="#007d72">单挡配腕部 3/3 帧确认，双挡 0/3 帧确认。</text>
<text x="890" y="1228" font-size="20" font-weight="400" fill="#466271">改进　独立记录物理落点，并保留“未确认”。</text>
<rect x="78" y="1095" width="660" height="158" rx="13" fill="#fff" stroke="#c9d7dc"/>
<rect x="80" y="1111" width="5" height="126" rx="2" fill="#985421" stroke="none"/>
<text x="102" y="1132" font-size="28" font-weight="700" fill="#172f43">网页回执  ·  状态与已执行步骤</text>
<text x="102" y="1166" font-size="20" font-weight="400" fill="#466271">直接呈现成功、失败、未确认或追问及 JSON 明细。</text>
<text x="102" y="1197" font-size="21" font-weight="700" fill="#985421">155 项软件测试通过；浏览器交互回归使用模型替身。</text>
<text x="102" y="1228" font-size="20" font-weight="400" fill="#466271">改进　保留任务草稿与现场；实机再核对停止延迟。</text>
<path d="M 866 1175 H 740" fill="none" stroke="#007d72" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#g)"/>
<text x="764" y="1156" font-size="18" font-weight="700" fill="#007d72">结果</text>
<path d="M 78 1180 H 30 V 182 H 75" fill="none" stroke="#985421" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#o)"/>
<text x="80" y="1299" font-size="20" font-weight="700" fill="#985421">橙线回到用户</text>
<text x="240" y="1299" font-size="20" font-weight="400" fill="#466271">本地状态、规划追问和最终回执返回同一页面。执行失败结束当前序列，用户可在原场地重新发令。</text>
<rect x="78" y="1344" width="1448" height="148" rx="14" fill="#16394c" stroke="none"/>
<text x="102" y="1391" font-size="27" font-weight="700" fill="#fff">规范复测</text>
<text x="102" y="1434" font-size="43" font-weight="700" fill="#9ce3d1">10/10</text>
<text x="310" y="1391" font-size="23" font-weight="700" fill="#ffffff">修复版 10 条合成音频 → SenseVoice → Reasoner / 本地控制 → MuJoCo</text>
<text x="310" y="1428" font-size="21" font-weight="400" fill="#d8e8e8">两度半、垂直下降、追问补单位、A→B→C→A 与运动中暂停均通过。</text>
<text x="310" y="1463" font-size="20" font-weight="400" fill="#d8e8e8">首轮 9/10：“移→引”使补答失败；只改 1 条用语复测。两轮 20 次转写、17 次云请求。</text>
<text x="79" y="1527" font-size="18" font-weight="400" fill="#466271">数据来自本组课程实验记录。实拍感知、公开真人朗读、文本留出与仿真运动分别计分。</text>
<path d="M 405 1030 V 1091" fill="none" stroke="#985421" stroke-width="3" marker-end="url(#o)"/>
<text x="424" y="1071" font-size="18" font-weight="700" fill="#985421">未通过，给出原因</text>
<path d="M 1526 951 H 1564 V 322 H 1528" fill="none" stroke="#007d72" stroke-width="3" stroke-linejoin="round" marker-end="url(#g)"/>
<text x="1539" y="501" transform="rotate(90 1539 501)" font-size="18" font-weight="700" fill="#007d72">动作后更新画面，各步重新检查观测</text>
</svg>
