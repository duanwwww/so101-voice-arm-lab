[project]
name = "voice-arm-lab"
version = "0.1.0"
description = "Single-camera SO-101 tabletop simulation and remote control lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==4.0.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.18,<1",
    "python-dotenv>=1,<2",
]
[project.optional-dependencies]
voice = [
    "faster-whisper>=1.1,<2",
    "edge-tts>=7,<8",
    "av==16.1.0",
]
data = [
    "pyarrow>=19,<26",
]

[tool.uv]
package = false
